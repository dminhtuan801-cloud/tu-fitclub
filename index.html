<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tự FITCLUB – Phòng tập Bắc Ninh</title>
<meta name="description" content="Tự FITCLUB – phòng tập tại Bắc Ninh. Đăng ký tư vấn và trải nghiệm tập luyện.">
<meta property="og:title" content="Tự FITCLUB">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🏋️%3C/text%3E%3C/svg%3E">
<style>
:root{--bg:#f4f1ea;--surface:#fff;--ink:#1d1d1f;--mute:#6b6a66;--line:#d9d4c8;--dark:#1b1c1e;--dark2:#26282b;--acc:#d95a1c;--accfg:#fff;--on-dark:#f4f1ea;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#151617;--surface:#1f2123;--ink:#f1eee7;--mute:#a19e96;--line:#34363a}}
:root[data-theme="dark"]{--bg:#151617;--surface:#1f2123;--ink:#f1eee7;--mute:#a19e96;--line:#34363a}
html{scroll-behavior:smooth;scroll-padding-top:calc(72px + env(safe-area-inset-top,0px))}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.65 "Helvetica Neue",Arial,system-ui,sans-serif;overflow-x:hidden}
h1,h2,h3{font-family:Georgia,"Times New Roman",serif;font-weight:700;line-height:1.08;margin:0}
h1{font-size:clamp(2.6rem,8vw,6rem);letter-spacing:-.02em}
h2{font-size:clamp(2rem,4.6vw,3.4rem);letter-spacing:-.01em}
h3{font-size:1.35rem}
a{color:inherit}
.wrap{max-width:1160px;margin:0 auto;padding:0 22px}
section{padding:96px 0}
.eyebrow{font-size:.75rem;letter-spacing:.22em;text-transform:uppercase;color:var(--acc);font-weight:700;margin-bottom:14px;display:block}
.lead{color:var(--mute);max-width:56ch;margin-top:18px}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 26px;border-radius:2px;border:1px solid var(--acc);background:var(--acc);color:var(--accfg);font-weight:700;letter-spacing:.04em;text-decoration:none;cursor:pointer;font-size:.9rem;transition:transform .25s,background .25s}
.btn:hover{transform:translateY(-2px)}
.btn.ghost{background:transparent;color:inherit;border-color:currentColor}
header{position:fixed;top:0;left:0;right:0;z-index:50;padding-top:env(safe-area-inset-top,0px);background:rgba(27,28,30,.88);backdrop-filter:blur(10px);color:var(--on-dark)}
.nav{display:flex;align-items:center;justify-content:space-between;height:68px}
.logo{font-family:Georgia,serif;font-weight:700;font-size:1.3rem;text-decoration:none;letter-spacing:.02em}
.logo b{color:var(--acc)}
nav ul{display:flex;gap:26px;list-style:none;margin:0;padding:0}
nav a{text-decoration:none;font-size:.85rem;letter-spacing:.06em;text-transform:uppercase;opacity:.85}
nav a:hover{opacity:1}
.tools{display:flex;gap:10px;align-items:center}
.lang{display:flex;border:1px solid rgba(255,255,255,.35);border-radius:2px}
.lang button{background:none;border:0;color:inherit;padding:7px 11px;font-weight:700;font-size:.78rem;cursor:pointer;opacity:.6}
.lang button[aria-pressed="true"]{background:var(--acc);opacity:1;color:#fff}
.burger{display:none;background:none;border:1px solid rgba(255,255,255,.35);color:inherit;width:44px;height:40px;cursor:pointer;border-radius:2px;font-size:1.1rem}
.hero{min-height:100vh;min-height:100svh;background:linear-gradient(160deg,#1b1c1e 0%,#2a2c30 55%,#3a2a22 100%);color:var(--on-dark);display:flex;align-items:flex-end;padding:140px 0 72px;position:relative;overflow:hidden}
.hero::after{display:none;content:"";position:absolute;right:-12%;top:12%;width:60vw;height:60vw;max-width:720px;max-height:720px;border:1px solid rgba(181,83,47,.5);border-radius:50%}
.hero .wrap{position:relative;z-index:1;display:grid;grid-template-columns:1.15fr .85fr;gap:48px;align-items:end}.hero figure{margin:0;border:1px solid rgba(255,255,255,.18);padding:10px;background:rgba(255,255,255,.04)}.hero figure img{display:block;width:100%;height:auto;aspect-ratio:16/10;object-fit:cover}.hero figcaption{font-size:.72rem;letter-spacing:.16em;text-transform:uppercase;color:#b9b5ab;margin-top:10px}
.hero p{max-width:52ch;color:#cfcac0;font-size:1.1rem;margin:24px 0 34px}
.cta-row{display:flex;gap:14px;flex-wrap:wrap}
.hero .btn.ghost{color:var(--on-dark)}
.about{display:grid;grid-template-columns:1fr 1fr;gap:56px;align-items:center}
.ph{background:repeating-linear-gradient(135deg,var(--line) 0 2px,transparent 2px 14px),var(--surface);border:1px dashed var(--mute);display:flex;align-items:center;justify-content:center;text-align:center;padding:16px;color:var(--mute);font-size:.82rem;min-height:200px}
.ab{width:100%;max-width:340px;height:auto;justify-self:center;border:1px solid var(--line);padding:8px;background:var(--surface)}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;margin-top:44px}
.card{background:var(--surface);border:1px solid var(--line);padding:0;transition:transform .35s,box-shadow .35s}
.card:hover{transform:translateY(-5px);box-shadow:0 18px 40px rgba(0,0,0,.12)}
.card .ph{border:0;border-bottom:1px dashed var(--mute);min-height:170px}
.card div.b{padding:22px}
.card p{color:var(--mute);margin:10px 0 0;font-size:.95rem}
.note{margin-top:30px;padding:14px 18px;border-left:3px solid var(--acc);background:var(--surface);color:var(--mute);font-size:.9rem}
.dark{background:var(--dark);color:var(--on-dark)}
.dark .lead{color:#b9b5ab}
.why{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:#3a3c40;margin-top:44px;border:1px solid #3a3c40}
.why div{background:var(--dark2);padding:30px 24px}
.why .n{font-family:Georgia,serif;color:var(--acc);font-size:2rem}
.why p{color:#b9b5ab;font-size:.93rem;margin:8px 0 0}
.grid{display:grid;grid-template-columns:repeat(6,1fr);grid-auto-rows:150px;gap:14px;margin-top:44px}
.grid .ph{min-height:0;transition:transform .4s}
.grid .ph:hover{transform:scale(1.02)}
.grid .a{grid-column:span 3;grid-row:span 3}.grid .b{grid-column:span 3;grid-row:span 2}.grid .c{grid-column:span 2;grid-row:span 2}.grid .d{grid-column:span 2;grid-row:span 1}.grid .e{grid-column:span 1;grid-row:span 1}
details{border-bottom:1px solid var(--line)}
summary{list-style:none;cursor:pointer;padding:22px 0;font-weight:700;display:flex;justify-content:space-between;gap:20px}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";color:var(--acc);font-size:1.4rem;line-height:1;transition:transform .3s}
details[open] summary::after{transform:rotate(45deg)}
details .ans{padding:0 0 22px;color:var(--mute);max-width:70ch;animation:fade .35s}
@keyframes fade{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
.contact{display:grid;grid-template-columns:1fr 1fr;gap:48px}
.info p{margin:0 0 14px;color:var(--mute)}.info strong{color:var(--ink)}
form{background:var(--surface);border:1px solid var(--line);padding:30px}
label{display:block;font-size:.8rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;margin:0 0 6px}
input,select{width:100%;min-height:48px;padding:0 14px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;border-radius:2px;margin-bottom:6px}
.err{color:#c0392b;font-size:.8rem;min-height:1.2em;margin-bottom:10px}
#msg{margin-top:14px;font-size:.92rem}
.final{text-align:center;background:linear-gradient(160deg,#1b1c1e,#3a2a22);color:var(--on-dark)}
.final h2{max-width:18ch;margin:0 auto 18px}
.final .cta-row{justify-content:center;margin-top:30px}
.final .btn.ghost{color:var(--on-dark)}
footer{background:#111213;color:#a9a59b;padding:48px 0 calc(32px + env(safe-area-inset-bottom,0px));font-size:.9rem}
footer .row{display:flex;justify-content:space-between;gap:24px;flex-wrap:wrap}
footer ul{list-style:none;padding:0;margin:0;display:flex;gap:20px;flex-wrap:wrap}
.rv{opacity:0;transform:translateY(24px);transition:opacity .8s,transform .8s}.rv.in{opacity:1;transform:none}
@media (max-width:900px){
 nav{position:fixed;inset:68px 0 auto 0;background:var(--dark);max-height:0;overflow:hidden;transition:max-height .35s;padding-top:0}
 nav.open{max-height:420px}nav ul{flex-direction:column;gap:0;padding:8px 22px 20px}nav li a{display:block;padding:14px 0;border-bottom:1px solid #333}
 .burger{display:block}.about,.contact{grid-template-columns:1fr}.cards{grid-template-columns:1fr}.why{grid-template-columns:1fr 1fr}
 .grid{grid-template-columns:repeat(2,1fr);grid-auto-rows:130px}.grid .a,.grid .b{grid-column:span 2;grid-row:span 2}.grid .c,.grid .d,.grid .e{grid-column:span 1;grid-row:span 1}
 section{padding:72px 0}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}.rv{opacity:1;transform:none}}
.gal{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;margin-top:44px}.gi{padding:0;border:0;background:none;cursor:zoom-in;overflow:hidden;aspect-ratio:3/4;display:block}.gi img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .5s}.gi:hover img{transform:scale(1.05)}
#lb{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.9);display:none;align-items:center;justify-content:center;padding:24px}#lb.on{display:flex}#lb img{max-width:92vw;max-height:84vh;width:auto;height:auto}#lb button{position:absolute;top:calc(16px + env(safe-area-inset-top,0px));right:16px;background:none;border:1px solid #fff;color:#fff;width:44px;height:44px;font-size:1.3rem;cursor:pointer}
@media (max-width:900px){.hero .wrap{grid-template-columns:1fr;gap:36px}.gal{grid-template-columns:repeat(2,1fr)}.gal .gi:last-child{grid-column:span 2;aspect-ratio:16/9}}
</style>
</head>
